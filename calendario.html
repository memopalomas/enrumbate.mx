  <main id="contenido">

        </div>
        <div id="cal"></div>
        <noscript><p class="empty">Para ver el calendario, activa JavaScript en tu navegador. También puedes preguntarnos por <a class="text-link" href="https://wa.me/523321570254">WhatsApp al 33 2157 0254</a>.</p></noscript>

  <script src="js/site.js"></script>
  <script>
  (function () {
    const fmtM = new Intl.DateTimeFormat('es-MX', { month: 'long', year: 'numeric' });
    const fmtMon = new Intl.DateTimeFormat('es-MX', { month: 'short' });
    const list = ENR.experiencias.filter(e => e.linea === 'originales' && ENRUI.vigente(e)).sort(ENRUI.byDate);
    const groups = new Map();
    list.forEach(e => {
      const k = e.fecha ? e.fecha.slice(0, 7) : 'pronto';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    });
    const html = [...groups].map(([k, items]) => {
      const title = k === 'pronto' ? 'Próximamente' : fmtM.format(new Date(k + '-15T12:00:00')).replace(' de ', ' ').replace(/^./, c => c.toUpperCase());
      return `<section class="cal-month"><h2>${title}</h2><div class="cal-list">${items.map(e => {
        const d = e.fecha ? new Date(e.fecha + 'T12:00:00') : null;
        const exact = e.fecha && /\b\d{1,2}\b/.test(e.fechaTexto);
        const box = d ? `<b>${exact ? d.getDate() : '—'}</b><small>${fmtMon.format(d).replace('.', '')}</small>` : `${ENRUI.icon('spark', 'cal-spark')}<small>Pronto</small>`;
        const cat = ENR.categorias[e.categoria]?.nombre || '';
        return `<article class="cal-item">
          <div class="cal-date" aria-hidden="true">${box}</div>
          <img class="cal-thumb" src="${e.img}" alt="" loading="lazy">
          <div class="cal-info"><span class="tag">${ENRUI.esc(cat)}</span><h3>${ENRUI.esc(e.titulo)}</h3><span>${ENRUI.esc(e.fechaTexto)} · ${ENRUI.esc(e.lugar)}</span></div>
          ${e.fecha
            ? `<a class="btn btn-primary" href="${ENRUI.wa('Hola Enrúmbate, quiero apartar lugar en: ' + e.titulo + ' · ' + e.fechaTexto)}" target="_blank" rel="noopener">${ENRUI.icon('wa', 'btn-icon')} Apartar lugar<span class="sr-only"> por WhatsApp</span></a>`
            : `<a class="btn btn-secondary" href="${ENRUI.wa('Hola Enrúmbate, avísenme cuando haya fecha para: ' + e.titulo)}" target="_blank" rel="noopener">${ENRUI.icon('wa', 'btn-icon')} Avísame<span class="sr-only"> cuando haya fecha, por WhatsApp</span></a>`}
        </article>`; }).join('')}</div></section>`;
    }).join('');
    document.getElementById('cal').innerHTML = html || ENRUI.emptyMsg('Estamos armando las próximas salidas.');
  })();
  </script>
