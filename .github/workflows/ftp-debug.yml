name: FTP debug (listar carpetas)
on: workflow_dispatch
jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - env:
          RAW: ${{ secrets.FTP_URL }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          host="${RAW#*://}"; host="${host%%/*}"
          for d in "" "public_html/" "../" "domains/"; do
            echo "===== /$d"
            curl -s --max-time 30 --list-only --user "$U:$P" "ftp://$host/$d" || echo "(no accesible)"
          done
          echo "===== PWD"; curl -s --max-time 30 --user "$U:$P" "ftp://$host/" -Q "PWD" -o /dev/null -v 2>&1 | grep -E '^< 257' || true
