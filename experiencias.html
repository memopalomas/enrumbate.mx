<body id="top">
  <a class="sr-only skip-link" href="#contenido">Saltar al contenido</a>
  <div id="site-header" data-active="experiencias"></div>
  <noscript><nav class="container noscript-nav" aria-label="Navegación"><a href="inicio.html">Inicio</a><a href="experiencias.html">Experiencias</a><a href="calendario.html">Calendario</a><a href="contacto.html">Contacto</a><a href="https://wa.me/523321570254">WhatsApp 33 2157 0254</a></nav></noscript>
  <main id="contenido">

    <section class="section-tight" aria-labelledby="page-title">
      <div class="container">
        <div class="section-head section-head-tight">
          <div>
            <h1 id="page-title" class="page-title">Todas las experiencias</h1>
            <p>Filtra por línea o por lo que se te antoja vivir.</p>
          </div>
        </div>
        <div class="filters" role="group" aria-label="Filtros">
          <div class="filter-row" id="f-linea">
            <span class="lbl">Línea</span>
            <button class="chip-btn" data-linea="" aria-pressed="true">Todas</button>
            <button class="chip-btn originales" data-linea="originales" aria-pressed="false">Originales</button>
            <button class="chip-btn select" data-linea="select" aria-pressed="false">Select</button>
          </div>
          <div class="filter-row" id="f-cat"><span class="lbl">Tipo</span></div>
        </div>
        <h2 class="sr-only">Resultados</h2>
        <div class="exp-grid" id="exp-results" aria-live="polite"></div>
        <p class="empty" id="exp-empty" hidden>Aún no hay experiencias de este tipo publicadas. <a class="text-link" href="https://wa.me/523321570254" data-wa="Hola Enrúmbate, busco una experiencia que no veo en la página">Pídenos una por WhatsApp</a>.</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const state = { linea: params.get('linea') || '', cat: params.get('cat') || '' };
    const catRow = document.getElementById('f-cat');
    const used = [...new Set(ENR.experiencias.map(e => e.categoria))];
    const keys = Object.keys(ENR.categorias).filter(k => used.includes(k));
    catRow.insertAdjacentHTML('beforeend', `<button class="chip-btn" data-cat="" aria-pressed="false">Todos</button>` +
      keys.map(k => `<button class="chip-btn" data-cat="${k}" aria-pressed="false">${ENR.categorias[k].nombre}</button>`).join(''));
    const out = document.getElementById('exp-results'), empty = document.getElementById('exp-empty');
    function render() {
      document.querySelectorAll('#f-linea .chip-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.linea === state.linea));
      document.querySelectorAll('#f-cat .chip-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === state.cat));
      const list = ENR.experiencias.filter(e => ENRUI.vigente(e) && (!state.linea || e.linea === state.linea) && (!state.cat || e.categoria === state.cat)).sort(ENRUI.byDate);
      out.innerHTML = list.map(ENRUI.card).join('');
      empty.hidden = list.length > 0;
      const q = new URLSearchParams(); if (state.linea) q.set('linea', state.linea); if (state.cat) q.set('cat', state.cat);
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
    }
    document.querySelector('.filters').addEventListener('click', e => {
      const b = e.target.closest('.chip-btn'); if (!b) return;
      if ('linea' in b.dataset) state.linea = b.dataset.linea;
      if ('cat' in b.dataset) state.cat = b.dataset.cat;
      render();
    });
    render();
  })();
  </script>
</body>
</html>
